<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowCalc</title>
    <link rel="icon" type="image/png" href="favicon.webp">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
       <div class="brand">
        <img src="catlogo.webp" alt="MeowCat">
        <div class="brand-text">
            <h1>MeowCalc</h1>
            <p>Where maths meets meow!</p>
        </div>
       </div>
    </header>
    <div id="main">
        <div id="calc">
            <div id="screen"></div>
            <div id="buttons">
    <button onclick="window.location='index.html'">AC</button>
    <button onclick="cancel()">C</button>
    <button onclick="updator('%')">%</button>
    <button onclick="updator('/')">/</button>
    <button onclick="updator('7')">7</button>
    <button onclick="updator('8')">8</button>
    <button onclick="updator('9')">9</button>
    <button onclick="updator('*')">*</button>
    <button onclick="updator('4')">4</button>
     <button onclick="updator('5')">5</button>
     <button onclick="updator('6')">6</button>
     <button onclick="updator('+')">+</button>
     <button onclick="updator('0')">0</button>
      <button onclick="updator('.')">.</button>
     <button onclick="updator('**')">**</button>
    <button onclick="calculate()">=</button>
            </div>
        </div>
    </div>
   <script src="script.js"></script>
</body>
</html>
